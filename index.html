<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a3540">
<title>Rain on Glass · 雨粒</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a2430}
#small,#c{display:block;position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
#small{pointer-events:none}

#fileIn{display:none}
#bgBtn{
  width:100%;padding:7px 0;border-radius:8px;
  background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.20);
  color:#ddeef8;font:13px system-ui,sans-serif;cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
#bgBtn:active{background:rgba(255,255,255,0.18)}

#settingsBtn{
  position:fixed;bottom:16px;left:16px;
  width:42px;height:42px;border-radius:21px;
  background:rgba(0,0,0,0.35);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.22);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:20px;color:#fff;
  opacity:0;transition:opacity 0.35s;
  -webkit-user-select:none;user-select:none;pointer-events:none;
}
#settingsBtn.vis{opacity:1;pointer-events:auto}

#settingsPanel{
  position:fixed;bottom:72px;left:16px;
  background:rgba(8,18,28,0.88);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.16);border-radius:14px;
  padding:18px 20px;color:#ddeef8;font:13px/1.7 system-ui,sans-serif;
  min-width:230px;display:none;
}
#settingsPanel.vis{display:block}
.srow{margin-bottom:13px}
.srow:last-child{margin-bottom:0}
.slabel{display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px}
.slabel span{color:#aac8e0}
input[type=range]{width:100%;cursor:pointer;accent-color:#5aaed4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="small"></canvas>
<input id="fileIn" type="file" accept="image/*">
<div id="settingsBtn" title="設定">⚙</div>
<div id="settingsPanel">
  <div class="srow">
    <div class="slabel">最小サイズ<span id="minRVal">1.0</span></div>
    <input type="range" id="minRSlider" min="0.5" max="3.0" step="0.1" value="1.0">
  </div>
  <div class="srow">
    <div class="slabel">最大サイズ<span id="maxRVal">6.0</span></div>
    <input type="range" id="maxRSlider" min="3.0" max="12.0" step="0.5" value="6.0">
  </div>
  <div class="srow">
    <div class="slabel">降雨強度<span id="spawnVal">中</span></div>
    <input type="range" id="spawnSlider" min="1" max="5" step="1" value="3">
  </div>
  <div class="srow">
    <button id="bgBtn">🖼 背景を変更</button>
  </div>
</div>

<script>
'use strict';

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const ctx      = canvas.getContext('2d');
const smallCvs = document.getElementById('small');
const smallCtx = smallCvs.getContext('2d');
const SMALL_R  = 5.5;  // tracked threshold
let W = 0, H = 0;

// ── Debug HUD / test backgrounds (only when URL contains #debug) ───────────────
const DEBUG = location.hash.indexOf('debug') !== -1;
let testBgMode = 0;               // 0 normal · 1 stripes · 2 checker · 3 white
let hudEl = null, frameT0 = 0;
const fpsBuf = [], msBuf = [];
if (DEBUG) {
  hudEl = document.createElement('div');
  hudEl.style.cssText =
    'position:fixed;top:8px;right:8px;z-index:99;padding:6px 9px;'
    + 'background:rgba(0,0,0,0.62);color:#9f9;font:11px/1.45 monospace;'
    + 'border-radius:6px;pointer-events:none;white-space:pre';
  document.body.appendChild(hudEl);
}
function updateHud(dt) {
  const ms = performance.now() - frameT0;
  msBuf.push(ms);  if (msBuf.length  > 60) msBuf.shift();
  fpsBuf.push(60 / dt); if (fpsBuf.length > 60) fpsBuf.shift();
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  const mx  = a => a.reduce((s, v) => Math.max(s, v), 0);
  const modes = ['normal', 'stripes', 'checker', 'white'];
  hudEl.textContent =
    `FPS ${avg(fpsBuf).toFixed(0)}\n` +
    `ms  ${avg(msBuf).toFixed(1)} / max ${mx(msBuf).toFixed(1)}\n` +
    `drops ${droplets.length}  trails ${trails.length}\n` +
    `bg ${bgDark ? 'dark' : 'light'}${bgHasImg ? ' img' : ''}  test ${modes[testBgMode]}`;
}

// Small-drop layer fades each frame
function fadeSmallLayer(dt) {
  smallCtx.globalAlpha = Math.pow(0.990, dt);
  smallCtx.globalCompositeOperation = 'destination-in';
  smallCtx.fillRect(0, 0, W, H);
  smallCtx.globalCompositeOperation = 'source-over';
  smallCtx.globalAlpha = 1;
}

function drawSmallDrop(x, y, r) {
  if (r < 0.4) return;
  // A water bead is transparent: it slightly DARKENS/distorts the background and
  // carries a tiny bright caustic point — never a flat blue disc.
  smallCtx.beginPath();
  smallCtx.arc(x, y, r, 0, Math.PI * 2);
  smallCtx.fillStyle = bgDark ? 'rgba(220,236,250,0.16)' : 'rgba(26,46,66,0.18)';
  smallCtx.fill();
  // Caustic: a small off-centre highlight where the lens focuses light
  if (r > 0.8) {
    smallCtx.beginPath();
    smallCtx.arc(x - r * 0.16, y - r * 0.16, Math.max(0.5, r * 0.3), 0, Math.PI * 2);
    smallCtx.fillStyle = 'rgba(255,255,255,0.50)';
    smallCtx.fill();
  }
  // Thin dark rim
  if (r > 1.2) {
    smallCtx.beginPath();
    smallCtx.arc(x, y, r, 0, Math.PI * 2);
    smallCtx.strokeStyle = 'rgba(8,24,44,0.30)';
    smallCtx.lineWidth = 0.5;
    smallCtx.stroke();
  }
}

// Draw a kamaboko water-ridge trail path (used for both live and dead trails)
function drawTrailSegs(segs, extraX, extraY) {
  const hasExtra = extraX !== undefined;
  const totalPts = segs.length + (hasExtra ? 1 : 0);
  if (totalPts < 2) return;
  const r = segs[segs.length - 1].r;
  const trailW = Math.max(2, r * 0.38);
  const buildPath = () => {
    ctx.beginPath();
    ctx.moveTo(segs[0].x, segs[0].y);
    for (let i = 1; i < segs.length; i++) ctx.lineTo(segs[i].x, segs[i].y);
    if (hasExtra) ctx.lineTo(extraX, extraY);
  };
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  buildPath();
  ctx.lineWidth = trailW + 1;
  ctx.strokeStyle = 'rgba(40,80,110,0.18)';
  ctx.stroke();
  buildPath();
  ctx.lineWidth = trailW;
  ctx.strokeStyle = bgHasImg ? 'rgba(195,222,240,0.42)' : 'rgba(175,207,228,0.42)';
  ctx.stroke();
  buildPath();
  ctx.lineWidth = trailW * 0.40;
  ctx.strokeStyle = 'rgba(220,240,255,0.20)';
  ctx.stroke();
  ctx.restore();
}

// ── Background ────────────────────────────────────────────────────────────────
// bgCvs always holds a full-screen copy of the current background so that drops
// can refract it — this is true even for the default (no-image) background.
//   bgReady  = bgCvs is a valid full-screen source to sample
//   bgHasImg = the user supplied a photo (drives colour choices)
//   bgDark   = the background is dark on average (drives bead visibility)
let bgImg = null, bgCvs = null, bgCtx2 = null;
let bgReady = false, bgHasImg = false, bgDark = false;

function ensureBgCvs() {
  bgCvs  = bgCvs  || document.createElement('canvas');
  bgCtx2 = bgCtx2 || bgCvs.getContext('2d', { willReadFrequently: true });
  bgCvs.width = W; bgCvs.height = H;
}

// Average luminance of bgCvs → bgDark (sparse sample, runs once per bg change)
function computeBgDark() {
  try {
    const d = bgCtx2.getImageData(0, 0, bgCvs.width, bgCvs.height).data;
    const step = Math.max(4, Math.floor(d.length / 4 / 2000)) * 4;
    let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += step) {
      sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++;
    }
    bgDark = n > 0 && sum / n < 100;
  } catch (e) { bgDark = false; }
}

function updateBgCvs() {
  if (!bgImg || !W) { if (!bgImg) buildDefaultBgCvs(); return; }
  ensureBgCvs();
  const sc = Math.max(W / bgImg.naturalWidth, H / bgImg.naturalHeight);
  const bw = bgImg.naturalWidth * sc, bh = bgImg.naturalHeight * sc;
  try { bgCtx2.filter = 'blur(1px)'; } catch(e) {}
  bgCtx2.drawImage(bgImg, (W - bw) / 2, (H - bh) / 2, bw, bh);
  bgCtx2.filter = 'none';
  bgReady = true; bgHasImg = true;
  computeBgDark();
}

// Render the default gradient into bgCvs so it can be refracted like a photo
function buildDefaultBgCvs() {
  if (!W) return;
  ensureBgCvs();
  drawDefaultBgTo(bgCtx2);
  bgReady = true; bgHasImg = false; bgDark = false;
}

// Debug: swap bgCvs for a test pattern (stripes/checker/white) to inspect refraction
function applyTestBg() {
  if (testBgMode === 0) { if (bgImg) updateBgCvs(); else buildDefaultBgCvs(); return; }
  ensureBgCvs();
  const c = bgCtx2;
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
  if (testBgMode === 1) {                       // vertical stripes, 20px bars
    c.fillStyle = '#111';
    for (let x = 0; x < W; x += 40) c.fillRect(x, 0, 20, H);
  } else if (testBgMode === 2) {                // 40px checkerboard
    c.fillStyle = '#111';
    for (let y = 0; y < H; y += 40)
      for (let x = 0; x < W; x += 40)
        if (((x / 40 + y / 40) & 1)) c.fillRect(x, y, 40, 40);
  }                                              // testBgMode === 3 → plain white
  bgReady = true; bgDark = false;
}

function loadImg(src) {
  const img = new Image();
  img.onload = () => { bgImg = img; updateBgCvs(); };
  img.src = src;
}

document.getElementById('bgBtn').addEventListener('click', () =>
  document.getElementById('fileIn').click());
document.getElementById('fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (f) loadImg(URL.createObjectURL(f));
});
canvas.addEventListener('dragover', e => e.preventDefault());
canvas.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f?.type.startsWith('image/')) loadImg(URL.createObjectURL(f));
});

// ── Config ────────────────────────────────────────────────────────────────────
// Real raindrop stats: drizzle r≈0.05-0.3mm, light r≈0.3-1mm, mod r≈1-1.5mm
// On ~70mm-wide phone screen ≈ 5.6px/mm → r≈1.7-5.6px for typical raindrops
// Live-wallpaper aesthetic: bias toward small, occasional large for drama
const CFG = {
  spawnProb:      0.90,
  minR:           1.0,
  maxR:           6.0,
  fallThresh:     10,
  gravity:        0.22,
  maxSpeed:       22,
  maxDroplets:    500,
  numStreaks:     16,
  refrMag:        1.65,
  trailDecay:     0.006,
  beadThresh:     1.3,
  beadProb:       0.20,
  maxTrails:      24,
  trailConsumeSpeed: 3.5,
  gridCell:       28,
  depositSpeedMin:2.8,
  depositInterval:4,
};

// ── Default background ────────────────────────────────────────────────────────
function drawDefaultBgTo(c) {
  const g = c.createLinearGradient(0, 0, W * 0.4, H);
  g.addColorStop(0,    '#bccbd4');
  g.addColorStop(0.45, '#cad8e2');
  g.addColorStop(1,    '#a8bfc9');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) {
    const yc = H * (0.1 + i * 0.18);
    const g2 = c.createLinearGradient(0, yc - 55, 0, yc + 55);
    g2.addColorStop(0,   'rgba(255,255,255,0)');
    g2.addColorStop(0.5, 'rgba(255,255,255,0.07)');
    g2.addColorStop(1,   'rgba(255,255,255,0)');
    c.fillStyle = g2; c.fillRect(0, yc - 55, W, 110);
  }
}
function drawBg() {
  if (bgReady && bgCvs) ctx.drawImage(bgCvs, 0, 0);
  else drawDefaultBgTo(ctx);
}

// Non-linear (lens-like) refraction for large drops: the background is sampled at
// a low magnification in the centre and progressively higher toward the rim, so
// the edge compresses the image like a real water lens. Rings are drawn outer→
// inner; each inner disc overdraws the previous one, so the visible magnification
// steps up as you move outward. Must be called INSIDE the drop's clip.
const RING_FRAC = [1.00, 0.72, 0.48, 0.26];
const RING_MAG  = [2.15, 1.75, 1.42, 1.18];
function refractRings(x, y, rx, ry) {
  for (let k = 0; k < RING_FRAC.length; k++) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, rx * RING_FRAC[k], ry * RING_FRAC[k], 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.translate(x, y);
    ctx.scale(-RING_MAG[k], -RING_MAG[k]);   // negative = inverted (倒立) lens image
    ctx.translate(-x, -y);
    ctx.drawImage(bgCvs, 0, 0);
    ctx.restore();
  }
}

// ── Rain streaks ──────────────────────────────────────────────────────────────
class Streak {
  constructor(init) { this.reset(init); }
  reset(init) {
    this.x   = Math.random() * W;
    this.y   = init ? Math.random() * H : -22;
    this.len = 8  + Math.random() * 16;
    this.spd = 7  + Math.random() * 8;
    this.a   = 0.04 + Math.random() * 0.09;
  }
  update() {
    this.x += this.spd * 0.10; this.y += this.spd;
    if (this.y > H + 25) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.len * 0.1, this.y + this.len);
    ctx.strokeStyle = bgHasImg
      ? `rgba(255,255,255,${this.a})`
      : `rgba(160,195,220,${this.a})`;
    ctx.lineWidth = 0.6; ctx.stroke();
  }
}
let streaks = [];

// ── Trail (water mark that beads up after drop exits) ─────────────────────────
class Trail {
  constructor(pts) {
    this.segs = pts.map(p => ({ x: p.x, y: p.y, r: p.r }));
    this.dead = false;
    this.consumed = 0; // px consumed from the top (oldest) end
  }
  update(dt) {
    const beads = [];
    this.consumed += CFG.trailConsumeSpeed * dt;
    const segPx = 4;
    const removeCount = Math.floor(this.consumed / segPx);
    for (let i = 0; i < Math.min(removeCount, this.segs.length); i++) {
      if (Math.random() < 0.42)
        beads.push({ x: this.segs[i].x + (Math.random() - 0.5) * 5, y: this.segs[i].y,
                     r: 2.2 + Math.random() * 2.8 });
    }
    if (removeCount > 0) {
      this.segs.splice(0, Math.min(removeCount, this.segs.length));
      this.consumed -= removeCount * segPx;
    }
    this.dead = this.segs.length < 2;
    return beads;
  }
  draw() { drawTrailSegs(this.segs); }
}

// ── Spatial grid ──────────────────────────────────────────────────────────────
class SpatialGrid {
  constructor() { this.cells = new Map(); }
  clear()       { this.cells.clear(); }
  insert(d, i) {
    const k = `${Math.floor(d.x/CFG.gridCell)},${Math.floor(d.y/CFG.gridCell)}`;
    let c = this.cells.get(k); if (!c) { c = []; this.cells.set(k, c); }
    c.push(i);
  }
  neighbors(d) {
    const cx = Math.floor(d.x/CFG.gridCell), cy = Math.floor(d.y/CFG.gridCell);
    const out = [];
    for (let dx = -1; dx <= 1; dx++)
      for (let dy = -1; dy <= 1; dy++) {
        const c = this.cells.get(`${cx+dx},${cy+dy}`);
        if (c) for (const i of c) out.push(i);
      }
    return out;
  }
}
const grid = new SpatialGrid();

// ── Droplet ───────────────────────────────────────────────────────────────────
class Droplet {
  constructor(x, y, r) {
    this.x = x; this.y = y; this.r = r;
    this.vy = 0; this.vx = (Math.random() - 0.5) * 0.15;
    this.falling = false; this.dead = false; this.bump = 0;
    this.trailPts    = [];
    this.lastTY      = y;
    this.lastDepositY = y;
    // Spawn impact spread: briefly larger collision radius so nearby drops merge
    this.impact = 0.75;
    // TTL for tiny beads
    this.ttl = r < 3.5 ? 150 + Math.random() * 260 : Infinity;
    // Contact-line pinning: narrower random range for hydrophobic surface
    this.pinExtra  = 0.6 + Math.random() * 2.2;
    this.pinReleased = false;
    // Stick-slip
    this.slipPhase  = 0;
    this.slipPeriod = 20 + Math.random() * 18;
    this.vibTimer   = 0;
  }

  get area() { return Math.PI * this.r * this.r; }

  overlaps(o) {
    const dx = this.x - o.x, dy = this.y - o.y;
    // Effective radius = max semi-axis of the ellipse (horizontal for oblate drops)
    // falling: oblate deformation; impact: spreading on landing; static: circle
    const myTn  = this.falling ? Math.min(1, Math.abs(this.vy) / CFG.maxSpeed) : 0;
    const mySx  = this.falling ? 1 + myTn * myTn * 0.55
                : this.impact > 0 ? 1 + this.impact * 0.22 : 1;
    const myEff = this.r * mySx * (1 + this.impact * 0.45);

    const oTn   = o.falling ? Math.min(1, Math.abs(o.vy) / CFG.maxSpeed) : 0;
    const oSx   = o.falling ? 1 + oTn * oTn * 0.55
                : o.impact > 0 ? 1 + o.impact * 0.22 : 1;
    const oEff  = o.r * oSx * (1 + o.impact * 0.45);

    const rr = (myEff + oEff) * 0.88;
    return dx * dx + dy * dy < rr * rr;
  }

  absorb(o) {
    const v1 = this.r * this.r * this.r;
    const v2 = o.r   * o.r   * o.r;
    const vt = v1 + v2;
    if (!this.falling) {
      const w1 = v1 * this.r * this.r, w2 = v2 * o.r * o.r, wt = w1 + w2;
      this.x = (this.x * w1 + o.x * w2) / wt;
      this.y = (this.y * w1 + o.y * w2) / wt;
    }
    this.r   = Math.cbrt(vt);
    this.ttl = Infinity;
    this.bump = Math.max(this.bump, 0.12);
    if (o.vy > this.vy) this.vy = o.vy * 0.45;
    o.dead = true;
  }

  update(dt) {
    if (this.ttl !== Infinity) {
      this.ttl -= dt;
      if (this.ttl <= 0) { this.dead = true; return; }
    }

    if (this.impact   > 0) this.impact   = Math.max(0, this.impact   - 0.09 * dt);
    if (this.bump     > 0) this.bump     = Math.max(0, this.bump     - 0.012 * dt);
    if (this.vibTimer > 0) this.vibTimer = Math.max(0, this.vibTimer - dt);

    // Contact-line pinning release
    if (!this.falling && this.r >= CFG.fallThresh + this.pinExtra) {
      this.falling     = true;
      this.pinReleased = true;
      this.vy          = 0.8 + Math.random() * 0.7; // release jerk
      this.lastTY      = this.y;
      this.lastDepositY = this.y;
      this.slipPhase   = this.slipPeriod * 0.6;
    }

    if (this.falling) {
      const excess = this.r - CFG.fallThresh;
      // Quadratic speed scaling — large drops accelerate dramatically
      const vMax = Math.min(CFG.maxSpeed, Math.max(1.5, excess * excess * 0.10 + excess * 0.40));

      // Stick-slip: larger drops have much less sticking (hydrophobic surface)
      this.slipPhase = (this.slipPhase + dt) % this.slipPeriod;
      const slipRatio = Math.max(0.06, 0.24 - excess * 0.014);
      const sticking  = this.slipPhase < this.slipPeriod * slipRatio;
      const gravMul   = sticking ? 0.05 : 1.0;
      const drag      = sticking ? Math.pow(0.82, dt) : 1.0;

      this.vy  = Math.min(this.vy * drag + CFG.gravity * gravMul * dt, vMax);
      this.y  += this.vy * dt;
      this.x  += this.vx * dt;
      this.vx *= Math.pow(0.93, dt);

      // Deposit tiny drops along path when falling fast (trail of beads)
      if (this.vy > CFG.depositSpeedMin) {
        const dist = this.y - this.lastDepositY;
        if (dist >= CFG.depositInterval) {
          const dr = 0.6 + Math.random() * 1.4;
          drawSmallDrop(
            this.x + (Math.random() - 0.5) * this.r * 0.55,
            this.lastDepositY + dist * Math.random(),
            dr
          );
          this.lastDepositY = this.y;
        }
      } else {
        this.lastDepositY = this.y;
      }

      // Record trail only where drop is already fast — avoids trail appearing at fall start
      if (this.vy > CFG.depositSpeedMin) {
        if (this.y - this.lastTY >= 4) {
          this.trailPts.push({ x: this.x, y: this.lastTY + 2, r: this.r });
          this.lastTY = this.y;
          if (this.trailPts.length > 200) this.trailPts.shift();
        }
      } else {
        this.lastTY = this.y;
      }

      if (this.y - this.r > H) this.dead = true;
    }
  }

  draw() {
    const impRad = 1 + Math.max(0, this.impact * 0.28);
    const r = this.r * (1 + Math.max(0, this.bump)) * impRad;

    // Oblate deformation: speed-based (and gentle spread during impact)
    const spd = this.falling ? Math.abs(this.vy) : 0;
    const tn  = Math.min(1, spd / CFG.maxSpeed);
    let sx = 1, sy = 1;
    if (this.falling) {
      sx = 1 + tn * tn * 0.55;
      sy = Math.max(0.58, 1 / (sx * 1.12));
    } else if (this.impact > 0) {
      // Spreading on impact: briefly wider/flatter
      sx = 1 + this.impact * 0.22;
      sy = Math.max(0.78, 1 / (sx * 1.06));
    }
    const rx = r * sx, ry = r * sy;
    const rMax = Math.max(rx, ry);
    const x = this.x, y = this.y;

    if (r < 3.2) {
      // Tiny tracked drop: darken + tiny caustic, matching the small-drop look
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = bgDark ? 'rgba(220,236,250,0.16)' : 'rgba(26,46,66,0.20)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(10,25,45,0.30)';
      ctx.lineWidth = 0.45; ctx.stroke();
      return;
    }

    const isEllipse = Math.abs(sx - 1) > 0.02 || Math.abs(sy - 1) > 0.02;
    const ringPath = () => {
      ctx.beginPath();
      if (isEllipse) ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      else           ctx.arc(x, y, r, 0, Math.PI * 2);
    };

    // Contact shadow: the lens steals light from just outside its rim (P1-4)
    if (r >= 10 && bgHasImg) {
      const og = ctx.createRadialGradient(x, y, rMax * 1.02, x, y, rMax * 1.28);
      og.addColorStop(0, 'rgba(0,0,0,0.10)');
      og.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = og;
      ctx.fillRect(x - rMax * 1.3, y - rMax * 1.3, rMax * 2.6, rMax * 2.6);
    }

    ctx.save();
    ringPath();
    ctx.clip();

    // Refraction — non-linear (lens) for big drops, single-pass for smaller
    if (bgReady && bgCvs) {
      if (r >= 10) {
        refractRings(x, y, rx, ry);
      } else {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(-CFG.refrMag, -CFG.refrMag);
        ctx.translate(-x, -y);
        ctx.drawImage(bgCvs, 0, 0);
        ctx.restore();
      }
    } else {
      const dg = ctx.createRadialGradient(x, y, 0, x, y, rMax);
      dg.addColorStop(0, 'rgba(20,40,60,0.10)');
      dg.addColorStop(1, 'rgba(20,40,60,0.22)');
      ctx.fillStyle = dg;
      ctx.fillRect(x - rx, y - ry, rx * 2, ry * 2);
    }

    // Caustic: light focuses just below centre (subtle) (P1-4)
    if (r >= 10) {
      const cg = ctx.createRadialGradient(x, y + ry * 0.15, 0, x, y + ry * 0.15, rMax * 0.38);
      cg.addColorStop(0, 'rgba(255,255,255,0.12)');
      cg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = cg;
      ctx.fillRect(x - rx, y - ry, rx * 2, ry * 2);
    }

    // Dark rim — concentrated in the outer 15% only; inside stays clear (P1-2)
    const rimG = ctx.createRadialGradient(x, y, rMax * 0.80, x, y, rMax);
    rimG.addColorStop(0,   'rgba(0,10,24,0)');
    rimG.addColorStop(0.7, 'rgba(0,10,24,0.10)');
    rimG.addColorStop(1,   'rgba(0,10,24,0.40)');
    ctx.fillStyle = rimG;
    ctx.fillRect(x - rx, y - ry, rx * 2, ry * 2);

    // Specular highlight — small, sharp, always upper (light source = the sky) (P1-2)
    const hx = x, hy = y - ry * 0.42, hlr = rMax * 0.34;
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hlr);
    hg.addColorStop(0,   'rgba(255,255,255,0.90)');
    hg.addColorStop(0.5, 'rgba(255,255,255,0.32)');
    hg.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.save();
    ctx.translate(hx, hy); ctx.scale(1, 0.6); ctx.translate(-hx, -hy);  // wide-not-tall
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(hx, hy, hlr, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.restore();  // end clip

    // Dark ring border
    ringPath();
    ctx.strokeStyle = 'rgba(0,12,28,0.40)';
    ctx.lineWidth   = Math.max(0.6, r * 0.052);
    ctx.stroke();
  }
}

// ── Simulation ────────────────────────────────────────────────────────────────
let droplets = [], trails = [];

function spawnAt(x, y, r) {
  if (r === undefined) {
    // Power-law bias toward smaller drops (matches real rain drop size distribution)
    const rnd = Math.pow(Math.random(), 2.4);
    r = CFG.minR + rnd * (CFG.maxR - CFG.minR);
  }
  if (r < SMALL_R) {
    drawSmallDrop(x, y, r);
    return;
  }
  if (droplets.length >= CFG.maxDroplets) return;
  droplets.push(new Droplet(x, y, r));
}

function randomSpawn() {
  const cx = CFG.maxR + Math.random() * (W - CFG.maxR * 2);
  const cy = CFG.maxR + Math.random() * (H - CFG.maxR * 2); // 画面全体
  const n  = Math.random() < 0.58 ? 1 : Math.random() < 0.68 ? 2 : 3;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.random() * 6;
    spawnAt(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
  }
}

function processMerges() {
  grid.clear();
  for (let i = 0; i < droplets.length; i++)
    if (!droplets[i].dead) grid.insert(droplets[i], i);
  for (let i = 0; i < droplets.length; i++) {
    if (droplets[i].dead) continue;
    for (const j of grid.neighbors(droplets[i])) {
      if (j <= i || droplets[j].dead) continue;
      if (!droplets[i].overlaps(droplets[j])) continue;
      const fi = droplets[i].falling, fj = droplets[j].falling;
      if      ( fi && !fj)                     droplets[i].absorb(droplets[j]);
      else if (!fi &&  fj)                     droplets[j].absorb(droplets[i]);
      else if (droplets[i].r >= droplets[j].r) droplets[i].absorb(droplets[j]);
      else                                     droplets[j].absorb(droplets[i]);
    }
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let lastTs = 0;

// Pause rendering when screen is off or app is backgrounded
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { lastTs = 0; requestAnimationFrame(frame); }
});

function frame(ts) {
  if (document.hidden) return; // screen off / minimized — stop drawing
  if (DEBUG) frameT0 = performance.now();
  const dt = lastTs ? Math.min((ts - lastTs) / 16.667, 2.5) : 1;
  lastTs = ts;

  // Support spawnProb > 1 by spawning Math.floor(prob) times + fractional chance
  if (droplets.length < CFG.maxDroplets) {
    const st = CFG.spawnProb * dt;
    const sn = Math.floor(st) + (Math.random() < (st % 1) ? 1 : 0);
    for (let i = 0; i < sn; i++) randomSpawn();
  }

  for (const d of droplets) d.update(dt);
  processMerges();

  // Cull dead; harvest trails
  const alive = [];
  for (const d of droplets) {
    if (d.dead) {
      if (d.falling && d.trailPts.length >= 4 && trails.length < CFG.maxTrails)
        trails.push(new Trail(d.trailPts));
    } else {
      alive.push(d);
    }
  }
  droplets = alive;

  // Update trails; rebeading
  const aliveT = [];
  for (const t of trails) {
    const beads = t.update(dt);
    for (const b of beads) spawnAt(b.x, b.y, b.r);
    if (!t.dead) aliveT.push(t);
  }
  trails = aliveT;

  // ── Render ───────────────────────────────────────────────────────────────
  fadeSmallLayer(dt);
  drawBg();

  for (const s of streaks) { s.update(); s.draw(); }
  // Dead trails (consume animation from top)
  for (const t of trails)   t.draw();
  // Live trails: grow progressively as the drop falls — never appears above current drop position
  for (const d of droplets) {
    if (d.falling && d.trailPts.length >= 1)
      drawTrailSegs(d.trailPts, d.x, d.y);
  }

  for (const d of droplets) if (!d.falling) d.draw();
  for (const d of droplets) if ( d.falling) d.draw();

  // Glass top-shine
  const shine = ctx.createLinearGradient(0, 0, 0, H * 0.07);
  shine.addColorStop(0, 'rgba(255,255,255,0.052)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine; ctx.fillRect(0, 0, W, H * 0.07);

  // Vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H * 0.28, W/2, H/2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.30)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (DEBUG) updateHud(dt);

  requestAnimationFrame(frame);
}

// ── Settings panel ────────────────────────────────────────────────────────────
const settingsBtn   = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
let settingsTimer   = null;

function showSettingsBtn() {
  settingsBtn.classList.add('vis');
  clearTimeout(settingsTimer);
  if (!settingsPanel.classList.contains('vis')) {
    settingsTimer = setTimeout(() => settingsBtn.classList.remove('vis'), 2800);
  }
}

settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('vis');
  clearTimeout(settingsTimer);
  if (!settingsPanel.classList.contains('vis')) {
    settingsTimer = setTimeout(() => settingsBtn.classList.remove('vis'), 2000);
  }
});

// Close settings when tapping main canvas
canvas.addEventListener('touchstart', () => {
  if (settingsPanel.classList.contains('vis')) {
    settingsPanel.classList.remove('vis');
    settingsTimer = setTimeout(() => settingsBtn.classList.remove('vis'), 1500);
  }
}, { passive: true });

const spawnLabels = ['霧雨', '小雨', '中雨', '大雨', '豪雨'];
const spawnProbs  = [0.20, 0.45, 0.90, 1.8, 3.5]; // 0.90を中央(中雨)に

document.getElementById('minRSlider').addEventListener('input', e => {
  CFG.minR = parseFloat(e.target.value);
  document.getElementById('minRVal').textContent = CFG.minR.toFixed(1);
});
document.getElementById('maxRSlider').addEventListener('input', e => {
  CFG.maxR = parseFloat(e.target.value);
  document.getElementById('maxRVal').textContent = CFG.maxR.toFixed(1);
});
document.getElementById('spawnSlider').addEventListener('input', e => {
  const v = parseInt(e.target.value) - 1;
  CFG.spawnProb = spawnProbs[v];
  document.getElementById('spawnVal').textContent = spawnLabels[v];
});

// Debug-only: cycle test backgrounds (normal → stripes → checker → white)
if (DEBUG) {
  const row = document.createElement('div');
  row.className = 'srow';
  const b = document.createElement('button');
  b.textContent = '🧪 テスト背景';
  b.style.cssText =
    'width:100%;padding:7px 0;border-radius:8px;background:rgba(255,255,255,0.10);'
    + 'border:1px solid rgba(255,255,255,0.20);color:#ddeef8;'
    + 'font:13px system-ui,sans-serif;cursor:pointer';
  b.addEventListener('click', () => { testBgMode = (testBgMode + 1) % 4; applyTestBg(); });
  row.appendChild(b);
  settingsPanel.appendChild(row);
}

// ── Input ─────────────────────────────────────────────────────────────────────
function onPointer(e) {
  if (e.target !== canvas) return;
  e.preventDefault();
  showSettingsBtn();
  const pts  = e.changedTouches ?? [e];
  const rect = canvas.getBoundingClientRect();
  const scx  = W / rect.width, scy = H / rect.height;
  for (const p of pts) {
    const px = (p.clientX - rect.left) * scx;
    const py = (p.clientY - rect.top)  * scy;

    // Tap vibration: near-threshold drops nudge downward
    const vibrThresh = CFG.fallThresh * 0.72;
    for (const d of droplets) {
      if (d.falling || d.r < vibrThresh) continue;
      const ratio = (d.r - vibrThresh) / (CFG.fallThresh - vibrThresh + d.pinExtra);
      d.y    += ratio * d.r * 0.50;
      d.bump  = Math.max(d.bump, 0.07 + ratio * 0.09);
      d.vibTimer = 8;
    }

    // Spawn drops at tap
    for (let i = 0; i < 4; i++)
      spawnAt(px + (Math.random() - 0.5) * 22, py + (Math.random() - 0.5) * 22);
  }
}
canvas.addEventListener('touchstart', onPointer, { passive: false });
canvas.addEventListener('mousedown',  onPointer);
document.addEventListener('mousedown', e => {
  if (e.target !== canvas) showSettingsBtn();
});

// ── Resize / Init ─────────────────────────────────────────────────────────────
function resizeCanvases() {
  // clientWidth/Height が UA の各種バー込みでも正確なビューポートサイズを返す
  W = canvas.width  = smallCvs.width  = document.documentElement.clientWidth  || window.innerWidth;
  H = canvas.height = smallCvs.height = document.documentElement.clientHeight || window.innerHeight;
}

function init() {
  resizeCanvases();
  updateBgCvs();
  streaks  = Array.from({ length: CFG.numStreaks }, () => new Streak(true));
  droplets = []; trails = [];
  for (let i = 0; i < 28; i++) randomSpawn();
}

window.addEventListener('resize', () => {
  resizeCanvases();
  if (DEBUG && testBgMode > 0) applyTestBg();
  else                         updateBgCvs();
  streaks = Array.from({ length: CFG.numStreaks }, () => new Streak(true));
});

init();
requestAnimationFrame(frame);
</script>
