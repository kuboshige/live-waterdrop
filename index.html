<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a3540">
<title>Rain on Glass · 雨粒</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a2430}
#c{display:block;position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}

#fileIn{display:none}
#bgBtn{
  width:100%;padding:7px 0;border-radius:8px;
  background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.20);
  color:#ddeef8;font:13px system-ui,sans-serif;cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
#bgBtn:active{background:rgba(255,255,255,0.18)}

#settingsBtn{
  position:fixed;bottom:16px;left:16px;
  width:42px;height:42px;border-radius:21px;
  background:rgba(0,0,0,0.35);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.22);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:20px;color:#fff;
  opacity:0;transition:opacity 0.35s;
  -webkit-user-select:none;user-select:none;pointer-events:none;
}
#settingsBtn.vis{opacity:1;pointer-events:auto}

#settingsPanel{
  position:fixed;bottom:72px;left:16px;
  background:rgba(8,18,28,0.88);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.16);border-radius:14px;
  padding:18px 20px;color:#ddeef8;font:13px/1.7 system-ui,sans-serif;
  min-width:230px;display:none;
}
#settingsPanel.vis{display:block}
.srow{margin-bottom:13px}
.srow:last-child{margin-bottom:0}
.slabel{display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px}
.slabel span{color:#aac8e0}
input[type=range]{width:100%;cursor:pointer;accent-color:#5aaed4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<input id="fileIn" type="file" accept="image/*">
<div id="settingsBtn" title="設定">⚙</div>
<div id="settingsPanel">
  <div class="srow">
    <div class="slabel">最小サイズ<span id="minRVal">1.8</span></div>
    <input type="range" id="minRSlider" min="0.5" max="3.0" step="0.1" value="1.8">
  </div>
  <div class="srow">
    <div class="slabel">最大サイズ<span id="maxRVal">6.0</span></div>
    <input type="range" id="maxRSlider" min="3.0" max="12.0" step="0.5" value="6.0">
  </div>
  <div class="srow">
    <div class="slabel">降雨強度<span id="spawnVal">中</span></div>
    <input type="range" id="spawnSlider" min="1" max="5" step="1" value="3">
  </div>
  <div class="srow">
    <button id="bgBtn">🖼 背景を変更</button>
  </div>
</div>

<script>
'use strict';

// Bump this every deploy so it's obvious which build is actually loaded
// (open ⚙ to see it, or the console). Helps catch stale browser caching.
const BUILD = '2026-07-05 · true-collision+thread-drain';
console.log('Rain on Glass — build:', BUILD);

// Network-first service worker: always loads the freshest deploy when online,
// works offline otherwise. Kills the stale-HTML-cache problem for good.
if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(() => {});

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const ctx      = canvas.getContext('2d');
let W = 0, H = 0;

// ── Debug HUD / test backgrounds (only when URL contains #debug) ───────────────
const DEBUG = location.hash.indexOf('debug') !== -1;
let testBgMode = 0;               // 0 normal · 1 stripes · 2 checker · 3 white
let hudEl = null, frameT0 = 0;
const fpsBuf = [], msBuf = [];
if (DEBUG) {
  hudEl = document.createElement('div');
  hudEl.style.cssText =
    'position:fixed;top:8px;right:8px;z-index:99;padding:6px 9px;'
    + 'background:rgba(0,0,0,0.62);color:#9f9;font:11px/1.45 monospace;'
    + 'border-radius:6px;pointer-events:none;white-space:pre';
  document.body.appendChild(hudEl);
}
function updateHud(dt) {
  const ms = performance.now() - frameT0;
  msBuf.push(ms);  if (msBuf.length  > 60) msBuf.shift();
  fpsBuf.push(60 / dt); if (fpsBuf.length > 60) fpsBuf.shift();
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  const mx  = a => a.reduce((s, v) => Math.max(s, v), 0);
  const modes = ['normal', 'stripes', 'checker', 'white'];
  hudEl.textContent =
    `FPS ${avg(fpsBuf).toFixed(0)}\n` +
    `ms  ${avg(msBuf).toFixed(1)} / max ${mx(msBuf).toFixed(1)}\n` +
    `drops ${droplets.length}  mist ${mist.length}  riv ${rivulets.length}\n` +
    `bg ${bgDark ? 'dark' : 'light'}${bgHasImg ? ' img' : ''}  test ${modes[testBgMode]}`;
}

// Hydrophobic surface: a running drop leaves NO lasting ridge — only a short,
// tapered tail directly behind it (max ~2.5r), fading to nothing. The path
// itself is wiped clean (see the sweep in Droplet.update).
function drawTail(d) {
  const vlen = Math.hypot(d.vx, d.vy);
  if (vlen < 0.001) return;
  const len = 2.4 * d.r;
  const ux = -d.vx / vlen, uy = -d.vy / vlen;   // unit vector opposite to motion
  const ex = d.x + ux * len, ey = d.y + uy * len; // tail tip
  const nx = -uy, ny = ux;                        // perpendicular
  const w = d.r * 0.42;                           // half-width at the drop
  ctx.beginPath();
  ctx.moveTo(d.x + nx * w, d.y + ny * w);
  ctx.lineTo(d.x - nx * w, d.y - ny * w);
  ctx.lineTo(ex, ey);
  ctx.closePath();
  const g = ctx.createLinearGradient(d.x, d.y, ex, ey);
  g.addColorStop(0, bgHasImg ? 'rgba(200,224,242,0.34)' : 'rgba(180,210,230,0.34)');
  g.addColorStop(1, 'rgba(200,224,242,0)');
  ctx.fillStyle = g;
  ctx.fill();
}

// ── Background ────────────────────────────────────────────────────────────────
// bgCvs always holds a full-screen copy of the current background so that drops
// can refract it — this is true even for the default (no-image) background.
//   bgReady  = bgCvs is a valid full-screen source to sample
//   bgHasImg = the user supplied a photo (drives colour choices)
//   bgDark   = the background is dark on average (drives bead visibility)
let bgImg = null, bgCvs = null, bgCtx2 = null;
let bgReady = false, bgHasImg = false, bgDark = false;

function ensureBgCvs() {
  bgCvs  = bgCvs  || document.createElement('canvas');
  bgCtx2 = bgCtx2 || bgCvs.getContext('2d', { willReadFrequently: true });
  bgCvs.width = W; bgCvs.height = H;
}

// Average luminance of bgCvs → bgDark (sparse sample, runs once per bg change)
function computeBgDark() {
  try {
    const d = bgCtx2.getImageData(0, 0, bgCvs.width, bgCvs.height).data;
    const step = Math.max(4, Math.floor(d.length / 4 / 2000)) * 4;
    let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += step) {
      sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++;
    }
    bgDark = n > 0 && sum / n < 100;
  } catch (e) { bgDark = false; }
}

function updateBgCvs() {
  if (!bgImg || !W) { if (!bgImg) buildDefaultBgCvs(); return; }
  ensureBgCvs();
  const sc = Math.max(W / bgImg.naturalWidth, H / bgImg.naturalHeight);
  const bw = bgImg.naturalWidth * sc, bh = bgImg.naturalHeight * sc;
  try { bgCtx2.filter = 'blur(1px)'; } catch(e) {}
  bgCtx2.drawImage(bgImg, (W - bw) / 2, (H - bh) / 2, bw, bh);
  bgCtx2.filter = 'none';
  bgReady = true; bgHasImg = true;
  computeBgDark();
  redrawMist();   // mist colours depend on bgDark — repaint for the new bg
}

// Render the default gradient into bgCvs so it can be refracted like a photo
function buildDefaultBgCvs() {
  if (!W) return;
  ensureBgCvs();
  drawDefaultBgTo(bgCtx2);
  bgReady = true; bgHasImg = false; bgDark = false;
}

// Debug: swap bgCvs for a test pattern (stripes/checker/white) to inspect refraction
function applyTestBg() {
  if (testBgMode === 0) { if (bgImg) updateBgCvs(); else buildDefaultBgCvs(); return; }
  ensureBgCvs();
  const c = bgCtx2;
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
  if (testBgMode === 1) {                       // vertical stripes, 20px bars
    c.fillStyle = '#111';
    for (let x = 0; x < W; x += 40) c.fillRect(x, 0, 20, H);
  } else if (testBgMode === 2) {                // 40px checkerboard
    c.fillStyle = '#111';
    for (let y = 0; y < H; y += 40)
      for (let x = 0; x < W; x += 40)
        if (((x / 40 + y / 40) & 1)) c.fillRect(x, y, 40, 40);
  }                                              // testBgMode === 3 → plain white
  bgReady = true; bgDark = false;
}

function loadImg(src) {
  const img = new Image();
  img.onload = () => { bgImg = img; updateBgCvs(); };
  img.src = src;
}

document.getElementById('bgBtn').addEventListener('click', () =>
  document.getElementById('fileIn').click());
document.getElementById('fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (f) loadImg(URL.createObjectURL(f));
});
canvas.addEventListener('dragover', e => e.preventDefault());
canvas.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f?.type.startsWith('image/')) loadImg(URL.createObjectURL(f));
});

// ── Config ────────────────────────────────────────────────────────────────────
// Real raindrop stats: drizzle r≈0.05-0.3mm, light r≈0.3-1mm, mod r≈1-1.5mm
// On ~70mm-wide phone screen ≈ 5.6px/mm → r≈1.7-5.6px for typical raindrops
// Live-wallpaper aesthetic: bias toward small, occasional large for drama
const CFG = {
  spawnProb:      0.90,
  minR:           1.8,
  maxR:           6.0,
  fallThresh:     10,
  gravity:        0.22,
  maxSpeed:       22,
  maxDroplets:    360,
  numStreaks:     16,
  refrMag:        1.65,
  gridCell:       28,
  depositSpeedMin:2.8,   // speed above which a drop is "running" (draws a tail)
  // Rivulet gate: only drops at least trailMinR big AND moving at least
  // trailMinSpeed leave the thin draining water-thread behind them.
  trailMinR:      12,
  trailMinSpeed:  7,
};

// Gravity direction as a UNIT vector. Right now it points straight down the
// screen; later this will be driven live by the device accelerometer
// (DeviceOrientation / DeviceMotion) so the rain runs toward real-world "down".
// Everything gravity-related goes through GRAV — change it and the drops fall
// that way. setGravity() normalises an arbitrary (ax,ay) into GRAV.
const GRAV = { x: 0, y: 1 };
function setGravity(ax, ay) {
  const m = Math.hypot(ax, ay);
  if (m > 1e-4) { GRAV.x = ax / m; GRAV.y = ay / m; }
}

// ── Default background ────────────────────────────────────────────────────────
function drawDefaultBgTo(c) {
  const g = c.createLinearGradient(0, 0, W * 0.4, H);
  g.addColorStop(0,    '#bccbd4');
  g.addColorStop(0.45, '#cad8e2');
  g.addColorStop(1,    '#a8bfc9');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) {
    const yc = H * (0.1 + i * 0.18);
    const g2 = c.createLinearGradient(0, yc - 55, 0, yc + 55);
    g2.addColorStop(0,   'rgba(255,255,255,0)');
    g2.addColorStop(0.5, 'rgba(255,255,255,0.07)');
    g2.addColorStop(1,   'rgba(255,255,255,0)');
    c.fillStyle = g2; c.fillRect(0, yc - 55, W, 110);
  }
}
function drawBg() {
  if (bgReady && bgCvs) ctx.drawImage(bgCvs, 0, 0);
  else drawDefaultBgTo(ctx);
}

// Non-linear (lens-like) refraction for large drops: the background is sampled at
// a low magnification in the centre and progressively higher toward the rim, so
// the edge compresses the image like a real water lens. Rings are drawn outer→
// inner; each inner disc overdraws the previous one, so the visible magnification
// steps up as you move outward. Must be called INSIDE the drop's clip.
const RING_FRAC = [1.00, 0.72, 0.48, 0.26];
const RING_MAG  = [2.15, 1.75, 1.42, 1.18];
function refractRings(x, y, rx, ry) {
  for (let k = 0; k < RING_FRAC.length; k++) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, rx * RING_FRAC[k], ry * RING_FRAC[k], 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.translate(x, y);
    ctx.scale(-RING_MAG[k], -RING_MAG[k]);   // negative = inverted (倒立) lens image
    ctx.translate(-x, -y);
    ctx.drawImage(bgCvs, 0, 0);
    ctx.restore();
  }
}

// ── Static mist layer ─────────────────────────────────────────────────────────
// Drops below MIST_R never move, wobble, or react to taps — so simulating them
// is wasted CPU. They are baked once into an offscreen canvas (zero per-frame
// cost, any quantity) and NEVER fade or evaporate. A lightweight record of each
// bead (x, y, r) is kept in a coarse grid so running drops can absorb them:
// the pixels get wiped along the path and their volume feeds the runner.
const MIST_R    = 3.0;
const MIST_MAX  = 6000;   // beyond this, new beads are pixels-only (no record)
const MIST_CELL = 26;
const mistCvs = document.createElement('canvas');
const mistCtx = mistCvs.getContext('2d');
let mist = [];                 // { x, y, r, dead }
const mistGrid = new Map();    // "gx,gy" → indices into mist

function mistKey(x, y) { return ((x / MIST_CELL) | 0) + ',' + ((y / MIST_CELL) | 0); }

function paintMist(x, y, r) {
  mistCtx.beginPath();
  mistCtx.arc(x, y, r, 0, Math.PI * 2);
  mistCtx.fillStyle = bgDark ? 'rgba(220,236,250,0.10)' : 'rgba(24,44,64,0.11)';
  mistCtx.fill();
  if (r > 1.6) {
    mistCtx.beginPath();
    mistCtx.arc(x - r * 0.2, y - r * 0.28, Math.max(0.5, r * 0.32), 0, Math.PI * 2);
    mistCtx.fillStyle = 'rgba(255,255,255,0.45)';
    mistCtx.fill();
  }
  mistCtx.beginPath();
  mistCtx.arc(x, y, r, 0, Math.PI * 2);
  mistCtx.strokeStyle = 'rgba(10,25,45,0.34)';
  mistCtx.lineWidth = 0.5;
  mistCtx.stroke();
}

function addMist(x, y, r) {
  if (r < 0.4 || x < -4 || x > W + 4 || y < -4 || y > H + 4) return;
  paintMist(x, y, r);
  if (mist.length >= MIST_MAX) compactMist();
  if (mist.length >= MIST_MAX) return;          // saturated: keep pixels only
  const idx = mist.length;
  mist.push({ x, y, r, dead: false });
  const k = mistKey(x, y);
  let c = mistGrid.get(k); if (!c) { c = []; mistGrid.set(k, c); }
  c.push(idx);
}

function compactMist() {
  mist = mist.filter(m => !m.dead);
  mistGrid.clear();
  for (let i = 0; i < mist.length; i++) {
    const k = mistKey(mist[i].x, mist[i].y);
    let c = mistGrid.get(k); if (!c) { c = []; mistGrid.set(k, c); }
    c.push(i);
  }
}

function redrawMist() {
  mistCtx.clearRect(0, 0, W, H);
  for (const m of mist) if (!m.dead) paintMist(m.x, m.y, m.r);
}

// Absorb every mist bead within `rad` of the segment (px,py)→(x,y): wipe the
// pixels (destination-out capsule) and return the total absorbed volume (Σr³).
function takeMist(px, py, x, y, rad) {
  let vol = 0;
  const x0 = Math.min(px, x) - rad - 4, x1 = Math.max(px, x) + rad + 4;
  const y0 = Math.min(py, y) - rad - 4, y1 = Math.max(py, y) + rad + 4;
  for (let gx = Math.floor(x0 / MIST_CELL); gx <= Math.floor(x1 / MIST_CELL); gx++)
    for (let gy = Math.floor(y0 / MIST_CELL); gy <= Math.floor(y1 / MIST_CELL); gy++) {
      const c = mistGrid.get(gx + ',' + gy);
      if (!c) continue;
      for (const i of c) {
        const m = mist[i];
        if (!m || m.dead) continue;
        if (segDist(px, py, x, y, m.x, m.y) < rad + m.r) {
          m.dead = true;
          vol += m.r * m.r * m.r;
        }
      }
    }
  // Erase pixels only when something was actually swallowed (or the record
  // table is saturated and pixel-only beads may exist). Touching the mist
  // canvas invalidates its GPU texture, so an unconditional per-frame stroke
  // for every falling drop would force a full re-upload every frame.
  if (vol > 0 || mist.length >= MIST_MAX) {
    mistCtx.save();
    mistCtx.globalCompositeOperation = 'destination-out';
    mistCtx.lineCap = 'round';
    mistCtx.lineWidth = rad * 2;
    mistCtx.strokeStyle = '#000';
    mistCtx.beginPath();
    mistCtx.moveTo(px, py);
    mistCtx.lineTo(x, y);
    mistCtx.stroke();
    mistCtx.restore();
  }
  return vol;
}

// ── Rivulet (thin water thread left by a running drop) ───────────────────────
// Live: the thread is attached to its running drop — always drawn all the way
// to the drop's centre, swelling into a neck near it (the drop body is drawn
// on top, hiding the junction, so the flare reads as an organic meniscus).
// The oldest (top) end dries into dotted mist beads.
// Severed / orphaned: the thread IS water — it drains downward into a real
// tracked bead at its LOWER end. The bead grows by exactly the drained volume
// while the thread shortens from the top (conservation). A grown bead can
// itself pass the release threshold and start running.
class Rivulet {
  constructor() {
    this.pts = [];
    this.done = false;
    this.headX = null; this.headY = null;  // live attachment point (drop centre)
    this.ownerR = 0;                       // drop radius, for neck sizing
    this.draining = false;                 // orphan mode: recede → feed the bead
    this.bead = null;                      // tracked Droplet growing at the tail
    this.drainAcc = 0;
  }
  record(x, y, r) {
    this.headX = x; this.headY = y; this.ownerR = r;
    const last = this.pts[this.pts.length - 1];
    if (last && Math.hypot(x - last.x, y - last.y) < 5) return;
    this.pts.push({ x, y, ttl: 60 + Math.random() * 55 });
  }
  // Detach from the owner drop: the thread's water now drains into a bead
  // born at the thread's lower end.
  orphan() {
    this.done = true;
    this.headX = null;
    if (this.pts.length < 3) { this.pts.length = 0; return; }
    const tail = this.pts[this.pts.length - 1];
    const b = new Droplet(tail.x, tail.y, 2.4);
    b.impact = 0;
    droplets.push(b);
    this.bead = b;
    this.draining = true;
  }
  // Split mid-thread: the upper part becomes an orphan draining thread, the
  // lower part stays attached to the drop. One skipped point = visible break.
  sever() {
    if (this.pts.length < 14) return;
    const k = 4 + Math.floor(Math.random() * (this.pts.length - 10));
    const upper = new Rivulet();
    upper.pts = this.pts.slice(0, k);
    this.pts  = this.pts.slice(k + 1);
    rivulets.push(upper);
    upper.orphan();
  }
  update(dt) {
    if (this.draining) {
      // A falling or absorbed bead no longer collects the thread's water
      if (this.bead && (this.bead.dead || this.bead.falling)) this.bead = null;
      this.drainAcc += 3.2 * dt;
      while (this.drainAcc > 0 && this.pts.length > 1) {
        const a = this.pts[0], b = this.pts[1];
        const L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        this.drainAcc -= L;
        if (Math.random() < 0.35)                 // dots where the thread dried
          addMist(a.x + (Math.random() - 0.5) * 3, a.y, 0.6 + Math.random());
        if (this.bead) {                          // pour the segment into the bead
          const vol = L * 1.15;                   // thread cross-section fudge
          this.bead.r = Math.cbrt(this.bead.r ** 3 + vol);
        }
        this.pts.shift();
      }
      if (this.pts.length <= 1) { this.pts.length = 0; return true; }
      return false;
    }
    // Live: dry from the oldest end, dotting the dried part with beads
    for (const p of this.pts) p.ttl -= dt;
    let n = 0;
    while (n < this.pts.length && this.pts[n].ttl <= 0) {
      const p = this.pts[n];
      if (Math.random() < 0.5)
        addMist(p.x + (Math.random() - 0.5) * 3, p.y, 0.7 + Math.random() * 1.2);
      n++;
    }
    if (n > 0) this.pts.splice(0, n);
    return this.done && this.pts.length === 0;   // true → remove me
  }
  draw() {
    const n = this.pts.length;
    if (n === 0) return;
    const live = this.headX !== null;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = bgDark ? 'rgba(215,235,250,0.30)' : 'rgba(60,90,120,0.28)';
    for (let i = 1; i < n; i++) {
      const a = this.pts[i - 1], b = this.pts[i];
      let w = Math.max(0.35, Math.min(1.8, Math.min(a.ttl, b.ttl) * 0.035));
      if (live) {
        // Neck: swell toward the drop so the thread flows out of it
        const dh = Math.hypot(b.x - this.headX, b.y - this.headY);
        const neckLen = this.ownerR * 3;
        if (dh < neckLen) w += (1 - dh / neckLen) * this.ownerR * 0.5;
      }
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    // Always connect the newest point to the drop centre — the drop is drawn
    // on top, so the thread visually emerges from inside it (never detached).
    if (live) {
      const last = this.pts[n - 1];
      ctx.lineWidth = Math.min(this.ownerR * 0.55, 1.8 + this.ownerR * 0.4);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(this.headX, this.headY); ctx.stroke();
    }
    // Draining: connect the tail into its growing bead the same way
    if (this.draining && this.bead && n >= 2) {
      const from = this.pts[Math.max(0, n - 3)];
      ctx.lineWidth = 2.0;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(this.bead.x, this.bead.y); ctx.stroke();
    }
    ctx.restore();
  }
}

// ── Rain streaks ──────────────────────────────────────────────────────────────
class Streak {
  constructor(init) { this.reset(init); }
  reset(init) {
    this.x   = Math.random() * W;
    this.y   = init ? Math.random() * H : -22;
    this.len = 8  + Math.random() * 16;
    this.spd = 7  + Math.random() * 8;
    this.a   = 0.04 + Math.random() * 0.09;
  }
  update() {
    this.x += this.spd * 0.10; this.y += this.spd;
    if (this.y > H + 25) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.len * 0.1, this.y + this.len);
    ctx.strokeStyle = bgHasImg
      ? `rgba(255,255,255,${this.a})`
      : `rgba(160,195,220,${this.a})`;
    ctx.lineWidth = 0.6; ctx.stroke();
  }
}
let streaks = [];

// ── Spatial grid ──────────────────────────────────────────────────────────────
class SpatialGrid {
  constructor() { this.cells = new Map(); }
  clear()       { this.cells.clear(); }
  insert(d, i) {
    const k = `${Math.floor(d.x/CFG.gridCell)},${Math.floor(d.y/CFG.gridCell)}`;
    let c = this.cells.get(k); if (!c) { c = []; this.cells.set(k, c); }
    c.push(i);
  }
  // Fills the caller-supplied array (reused across calls) to avoid per-frame
  // allocation churn / GC spikes when there are hundreds of drops.
  // Search range scales with THIS drop's own visual reach only: in any touching
  // pair the larger drop's reach bounds the centre distance (d ≤ 2·bigReach),
  // so the larger one always finds the smaller — tiny drops keep a cheap 3×3
  // scan and only actual giants scan wider. (processMerges checks both
  // directions, so one-sided discovery is enough.)
  neighbors(d, out) {
    out.length = 0;
    const cell  = CFG.gridCell;
    const reach = Math.max(d.shRx, d.shRy);
    const range = Math.min(3, 1 + Math.floor((2 * reach + 2) / cell));
    const cx = Math.floor(d.x/cell), cy = Math.floor(d.y/cell);
    for (let dx = -range; dx <= range; dx++)
      for (let dy = -range; dy <= range; dy++) {
        const c = this.cells.get(`${cx+dx},${cy+dy}`);
        if (c) for (const i of c) out.push(i);
      }
    return out;
  }
}
const grid = new SpatialGrid();

// ── Droplet ───────────────────────────────────────────────────────────────────
class Droplet {
  constructor(x, y, r) {
    this.x = x; this.y = y; this.r = r;
    this.px = x; this.py = y;           // previous position (for path sweeping)
    this.vy = 0; this.vx = (Math.random() - 0.5) * 0.15;
    this.falling = false; this.dead = false; this.bump = 0;
    this.age = Math.random() * 100;     // for per-drop tremble / wander phase
    // Spawn impact spread: briefly larger collision radius so nearby drops merge
    this.impact = 0.75;
    // Rivulet (thin water thread) this drop is currently laying down, if any
    this.rivulet = null;
    // Contact-line pinning: narrower random range for hydrophobic surface
    this.pinExtra  = 0.6 + Math.random() * 2.2;
    this.pinReleased = false;
    // Stick-slip
    this.slipPhase  = 0;
    this.slipPeriod = 20 + Math.random() * 18;
    this.vibTimer   = 0;
    // Coalescence oscillation ("ぷるぷる"): amplitude, phase, angular freq
    this.osc = 0; this.oscPhase = 0; this.oscFreq = 0;
    // Birth wobble: landing drops pulse too (and that pulse can touch a
    // neighbour — the shape below feeds the collision test, so it merges)
    if (r >= 6) { this.osc = 0.20; this.oscFreq = (Math.PI * 2) / (6 + r * 0.25); }
    // Meander: per-drop wander frequency for a non-straight run
    this.wanderF = 0.05 + Math.random() * 0.05;
    this.computeShape();
  }

  get area() { return Math.PI * this.r * this.r; }

  // THE single source of truth for this drop's current visual ellipse.
  // draw() renders exactly this and overlaps() collides exactly this, so
  // "the rims look like they touch" and "they merge" can never disagree.
  // Includes: tap bump, spawn-impact spread, fall flattening, pre-release
  // omen stretch, and the coalescence/birth wobble.
  computeShape() {
    const impRad = 1 + Math.max(0, this.impact * 0.28);
    const r = this.r * (1 + Math.max(0, this.bump)) * impRad;
    const spd = this.falling ? Math.abs(this.vy) : 0;
    const tn  = Math.min(1, spd / CFG.maxSpeed);
    let sx = 1, sy = 1;
    if (this.falling) {
      sx = 1 + tn * tn * 0.55;
      sy = Math.max(0.58, 1 / (sx * 1.12));
    } else if (this.impact > 0) {
      sx = 1 + this.impact * 0.22;
      sy = Math.max(0.78, 1 / (sx * 1.06));
    } else {
      // Pre-release omen: nearing the tipping size, it stretches and trembles
      const preStart = CFG.fallThresh * 0.85;
      const releaseR = CFG.fallThresh + this.pinExtra;
      const near = Math.max(0, Math.min(1, (this.r - preStart) / (releaseR - preStart)));
      if (near > 0) {
        sy = 1 + near * 0.06;
        const tr = Math.sin(this.age * 0.5) * near * 0.015;
        sx += tr; sy -= tr;
      }
    }
    // Coalescence/birth wobble: x/y pulse out of phase (volume-preserving)
    if (this.osc > 0) {
      const o = this.osc * Math.sin(this.oscPhase);
      sx *= 1 + o; sy *= 1 - o;
    }
    this.shR = r; this.shSx = sx; this.shSy = sy;
    this.shRx = r * sx; this.shRy = r * sy;
  }

  // Radius of this drop's current ellipse along direction (ux,uy)
  radiusAlong(ux, uy) {
    return (this.shRx * this.shRy) / Math.hypot(this.shRy * ux, this.shRx * uy);
  }

  overlaps(o) {
    const dx = o.x - this.x, dy = o.y - this.y;
    const d2 = dx * dx + dy * dy;
    const quick = Math.max(this.shRx, this.shRy) + Math.max(o.shRx, o.shRy) + 2;
    if (d2 > quick * quick) return false;
    const d  = Math.sqrt(d2) || 1e-4;
    const ux = dx / d, uy = dy / d;
    // +1.2px: the drawn dark rim sits just outside the fill — rims touch = merge
    return d < this.radiusAlong(ux, uy) + o.radiusAlong(ux, uy) + 1.2;
  }

  absorb(o) {
    const v1 = this.r * this.r * this.r;
    const v2 = o.r   * o.r   * o.r;
    const vt = v1 + v2;
    if (!this.falling) {
      const w1 = v1 * this.r * this.r, w2 = v2 * o.r * o.r, wt = w1 + w2;
      this.x = (this.x * w1 + o.x * w2) / wt;
      this.y = (this.y * w1 + o.y * w2) / wt;
    }
    this.r   = Math.cbrt(vt);
    // Coalescence wobble ("ぷるん"). Only drops big enough to be perceptible (and
    // that might eventually run) wobble visibly — tiny drops physically settle
    // faster than the eye can follow, so we skip it entirely for them.
    if (this.r >= 6) {
      const grew = v2 / vt;                     // fraction of new volume absorbed
      this.osc      = Math.min(0.38, this.osc + 0.18 + grew * 0.55);
      this.oscPhase = 0;
      this.oscFreq  = (Math.PI * 2) / (6 + this.r * 0.25);  // bigger = a bit slower
    }
    if (o.vy > this.vy) this.vy = o.vy * 0.45;
    o.dead = true;
    // The merged, larger footprint swallows any mist beads now underneath it
    const mv = takeMist(this.x, this.y, this.x, this.y, this.r * 0.9);
    if (mv > 0) this.r = Math.cbrt(this.r * this.r * this.r + mv);
    this.computeShape();
  }

  update(dt) {
    this.age += dt;
    if (this.impact   > 0) this.impact   = Math.max(0, this.impact   - 0.09 * dt);
    if (this.bump     > 0) this.bump     = Math.max(0, this.bump     - 0.012 * dt);
    if (this.vibTimer > 0) this.vibTimer = Math.max(0, this.vibTimer - dt);

    // Coalescence wobble decay — settles fast (~0.15s), a couple of quick bounces
    if (this.osc > 0.004) {
      this.oscPhase += this.oscFreq * dt;
      this.osc      *= Math.pow(0.85, dt);
    } else {
      this.osc = 0;
    }

    // Contact-line pinning release
    if (!this.falling && this.r >= CFG.fallThresh + this.pinExtra) {
      this.falling     = true;
      this.pinReleased = true;
      this.vy          = 0.8 + Math.random() * 0.7; // release jerk
      this.px = this.x; this.py = this.y;           // start sweep from here
      this.slipPhase   = this.slipPeriod * 0.6;
    }

    if (this.falling) {
      const excess = this.r - CFG.fallThresh;
      // Quadratic speed scaling — large drops accelerate dramatically
      const vMax = Math.min(CFG.maxSpeed, Math.max(1.5, excess * excess * 0.10 + excess * 0.40));

      // Stick-slip: larger drops have much less sticking (hydrophobic surface)
      this.slipPhase = (this.slipPhase + dt) % this.slipPeriod;
      const slipRatio = Math.max(0.06, 0.24 - excess * 0.014);
      const sticking  = this.slipPhase < this.slipPeriod * slipRatio;
      const gravMul   = sticking ? 0.05 : 1.0;
      const drag      = sticking ? Math.pow(0.82, dt) : 1.0;
      // Mass feel: bigger drops accelerate more sluggishly (heavier) even though
      // their top speed is higher — so they start slow and build up weightily.
      const massMul   = Math.max(0.55, 1 - excess * 0.02);

      // Accelerate along the gravity vector. Velocity is split into the
      // along-gravity component (gets drag + gravity + the speed cap) and the
      // perpendicular component (wander / attraction). This already works for
      // ANY GRAV direction — only the live accelerometer feed remains to add.
      let vAlong = this.vx * GRAV.x + this.vy * GRAV.y;
      const vpx = this.vx - vAlong * GRAV.x, vpy = this.vy - vAlong * GRAV.y;
      vAlong = vAlong * drag + CFG.gravity * gravMul * massMul * dt;
      if (vAlong > vMax) vAlong = vMax;
      this.vx = vpx + vAlong * GRAV.x;
      this.vy = vpy + vAlong * GRAV.y;

      // Meander: low-frequency lateral wander so the run isn't a straight line
      this.vx += (Math.sin(this.age * this.wanderF)
                + Math.sin(this.age * this.wanderF * 2.3) * 0.5) * 0.03 * dt;

      // Attraction: gently veer toward the nearest static drop just ahead so the
      // run "reaches out" and swallows it (only scans while falling — cheap).
      let best = null, bestD = 1e9;
      for (const o of droplets) {
        if (o === this || o.falling || o.dead) continue;
        const ddx = o.x - this.x, ddy = o.y - this.y;
        if (ddy < 0 || ddy > 4 * this.r || Math.abs(ddx) > 2 * this.r) continue;
        const dd = ddx * ddx + ddy * ddy;
        if (dd < bestD) { bestD = dd; best = o; }
      }
      if (best) this.vx += Math.sign(best.x - this.x) * 0.035 * dt;

      this.y  += this.vy * dt;
      this.x  += this.vx * dt;
      // Damp only the perpendicular (sideways) drift, never the along-gravity
      // fall — keeps this correct when GRAV is later tilted by the accelerometer.
      const al = this.vx * GRAV.x + this.vy * GRAV.y;
      let pxv = (this.vx - al * GRAV.x) * Math.pow(0.93, dt);
      let pyv = (this.vy - al * GRAV.y) * Math.pow(0.93, dt);
      this.vx = pxv + al * GRAV.x;
      this.vy = pyv + al * GRAV.y;

      // Sweep: absorb the mist along the swept path — the pixels are wiped
      // clean and their volume feeds this drop, so it grows as it runs.
      // No speed gate: even a slowly creeping drop swallows what it touches.
      const speed = Math.hypot(this.vx, this.vy);
      {
        const vol = takeMist(this.px, this.py, this.x, this.y, this.r * 0.95);
        if (vol > 0) this.r = Math.cbrt(this.r * this.r * this.r + vol);
      }
      // Rivulet: a big fast drop starts laying a thin water thread, and keeps
      // laying it (even through slow stick phases) so the thread is never
      // detached from the drop. Occasionally the thread snaps mid-way — the
      // severed upper part drains into a bead at its lower end.
      if (!this.rivulet && this.r >= CFG.trailMinR && speed >= CFG.trailMinSpeed
          && rivulets.length < 14) {
        this.rivulet = new Rivulet();
        rivulets.push(this.rivulet);
      }
      if (this.rivulet) {
        this.rivulet.record(this.x, this.y, this.r);
        if (this.rivulet.pts.length > 20 && Math.random() < 0.006 * dt)
          this.rivulet.sever();
      }

      // Despawn once fully past the downstream screen edge (along gravity)
      if ((GRAV.y > 0 && this.y - this.r > H) || (GRAV.y < 0 && this.y + this.r < 0) ||
          (GRAV.x > 0 && this.x - this.r > W) || (GRAV.x < 0 && this.x + this.r < 0))
        this.dead = true;
    }

    this.px = this.x; this.py = this.y;
    this.computeShape();   // cache the visual ellipse for this frame's collisions
  }

  draw() {
    // Render exactly the ellipse the collision system uses (computeShape)
    this.computeShape();
    const r = this.shR, sx = this.shSx, sy = this.shSy;
    const rx = this.shRx, ry = this.shRy;
    const rMax = Math.max(rx, ry);
    const x = this.x, y = this.y;

    if (r < 3.2) {
      // Tiny drop: read as a faint glass bead (rim + small highlight), not a
      // solid dot — a very light body keeps it from looking like drizzle.
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = bgDark ? 'rgba(220,236,250,0.10)' : 'rgba(24,44,64,0.11)';
      ctx.fill();
      if (r > 1.6) {                       // tiny upper caustic highlight
        ctx.beginPath();
        ctx.arc(x - r * 0.2, y - r * 0.28, Math.max(0.5, r * 0.32), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(10,25,45,0.34)';
      ctx.lineWidth = 0.5; ctx.stroke();
      return;
    }

    const isEllipse = Math.abs(sx - 1) > 0.02 || Math.abs(sy - 1) > 0.02;
    const ringPath = () => {
      ctx.beginPath();
      if (isEllipse) ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      else           ctx.arc(x, y, r, 0, Math.PI * 2);
    };

    // Contact shadow: the lens steals light from just outside its rim (P1-4)
    if (r >= 10 && bgHasImg) {
      const og = ctx.createRadialGradient(x, y, rMax * 1.02, x, y, rMax * 1.28);
      og.addColorStop(0, 'rgba(0,0,0,0.10)');
      og.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = og;
      ctx.fillRect(x - rMax * 1.3, y - rMax * 1.3, rMax * 2.6, rMax * 2.6);
    }

    ctx.save();
    ringPath();
    ctx.clip();

    // Refraction — non-linear (lens) for big drops, single-pass for smaller
    if (bgReady && bgCvs) {
      if (r >= 10) {
        refractRings(x, y, rx, ry);
      } else {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(-CFG.refrMag, -CFG.refrMag);
        ctx.translate(-x, -y);
        ctx.drawImage(bgCvs, 0, 0);
        ctx.restore();
      }
    } else {
      const dg = ctx.createRadialGradient(x, y, 0, x, y, rMax);
      dg.addColorStop(0, 'rgba(20,40,60,0.10)');
      dg.addColorStop(1, 'rgba(20,40,60,0.22)');
      ctx.fillStyle = dg;
      ctx.fillRect(x - rx, y - ry, rx * 2, ry * 2);
    }

    // Caustic: light focuses just below centre (subtle) (P1-4)
    if (r >= 10) {
      const cg = ctx.createRadialGradient(x, y + ry * 0.15, 0, x, y + ry * 0.15, rMax * 0.38);
      cg.addColorStop(0, 'rgba(255,255,255,0.12)');
      cg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = cg;
      ctx.fillRect(x - rx, y - ry, rx * 2, ry * 2);
    }

    // Dark rim — concentrated in the outer 15% only; inside stays clear (P1-2)
    const rimG = ctx.createRadialGradient(x, y, rMax * 0.80, x, y, rMax);
    rimG.addColorStop(0,   'rgba(0,10,24,0)');
    rimG.addColorStop(0.7, 'rgba(0,10,24,0.10)');
    rimG.addColorStop(1,   'rgba(0,10,24,0.40)');
    ctx.fillStyle = rimG;
    ctx.fillRect(x - rx, y - ry, rx * 2, ry * 2);

    // Specular highlight — small, sharp, always upper (light source = the sky) (P1-2)
    const hx = x, hy = y - ry * 0.42, hlr = rMax * 0.34;
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hlr);
    hg.addColorStop(0,   'rgba(255,255,255,0.90)');
    hg.addColorStop(0.5, 'rgba(255,255,255,0.32)');
    hg.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.save();
    ctx.translate(hx, hy); ctx.scale(1, 0.6); ctx.translate(-hx, -hy);  // wide-not-tall
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(hx, hy, hlr, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.restore();  // end clip

    // Dark ring border
    ringPath();
    ctx.strokeStyle = 'rgba(0,12,28,0.40)';
    ctx.lineWidth   = Math.max(0.6, r * 0.052);
    ctx.stroke();
  }
}

// ── Simulation ────────────────────────────────────────────────────────────────
let droplets = [], rivulets = [];

function spawnAt(x, y, r) {
  if (r === undefined) {
    // Power-law bias toward smaller drops (matches real rain drop size distribution)
    const rnd = Math.pow(Math.random(), 2.4);
    r = CFG.minR + rnd * (CFG.maxR - CFG.minR);
  }
  // Tiny drops don't move, wobble or react — bake them into the static mist
  // layer (zero per-frame cost, never fades) instead of simulating them.
  if (r < MIST_R) { addMist(x, y, r); return; }
  if (droplets.length >= CFG.maxDroplets) {
    // Never hard-stop the rain at the cap: demote the smallest static drop
    // into the mist layer. Its pixels stay on the glass exactly where it was
    // (it just stops being simulated), and the freed slot takes the newcomer.
    let mi = -1, mr = Infinity;
    for (let i = 0; i < droplets.length; i++) {
      const d = droplets[i];
      if (d.falling || d.r >= mr) continue;
      mr = d.r; mi = i;
    }
    if (mi < 0) return;              // everything is falling (vanishingly rare)
    const dm = droplets[mi];
    addMist(dm.x, dm.y, dm.r);
    droplets[mi] = droplets[droplets.length - 1];
    droplets.pop();
  }
  const d = new Droplet(x, y, r);
  // Landing on existing mist: swallow the beads underneath (wipe + grow)
  const vol = takeMist(x, y, x, y, r * 0.9);
  if (vol > 0) d.r = Math.cbrt(d.r * d.r * d.r + vol);
  droplets.push(d);
}

function randomSpawn() {
  const cx = CFG.maxR + Math.random() * (W - CFG.maxR * 2);
  const cy = CFG.maxR + Math.random() * (H - CFG.maxR * 2); // 画面全体
  const n  = Math.random() < 0.80 ? 1 : Math.random() < 0.92 ? 2 : 3;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.random() * 6;
    spawnAt(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
  }
}

// Distance from point (x,y) to the segment (px,py)-(qx,qy)
function segDist(px, py, qx, qy, x, y) {
  const dx = qx - px, dy = qy - py, L = dx * dx + dy * dy;
  let t = L ? ((x - px) * dx + (y - py) * dy) / L : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = px + t * dx, cy = py + t * dy;
  return Math.hypot(x - cx, y - cy);
}
// A fast runner sweeps over a static drop this frame even if their centres never
// coincided at a sampled position (anti-tunnelling → guarantees a clean path).
function sweptHit(fast, o) {
  if (!fast.falling || fast.vy <= CFG.depositSpeedMin || o.falling) return false;
  return segDist(fast.px, fast.py, fast.x, fast.y, o.x, o.y) < fast.r * 0.95 + o.r;
}

const _nb = [];   // reused neighbour buffer
function processMerges() {
  grid.clear();
  for (let i = 0; i < droplets.length; i++)
    if (!droplets[i].dead) grid.insert(droplets[i], i);
  for (let i = 0; i < droplets.length; i++) {
    if (droplets[i].dead) continue;
    grid.neighbors(droplets[i], _nb);
    for (const j of _nb) {
      // No j<=i dedup: with size-scaled search ranges a pair may be visible
      // from only ONE side (the larger drop). Checking both directions is
      // required; a re-encounter after a merge is skipped by the dead check.
      if (j === i || droplets[i].dead || droplets[j].dead) continue;
      const a = droplets[i], b = droplets[j];
      if (!a.overlaps(b) && !sweptHit(a, b) && !sweptHit(b, a)) continue;
      const fi = a.falling, fj = b.falling;
      if      ( fi && !fj)         a.absorb(b);
      else if (!fi &&  fj)         b.absorb(a);
      else if (a.r >= b.r)         a.absorb(b);
      else                        b.absorb(a);
    }
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let lastTs = 0;

// Pause rendering when screen is off or app is backgrounded
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { lastTs = 0; requestAnimationFrame(frame); }
});

function frame(ts) {
  if (document.hidden) return; // screen off / minimized — stop drawing
  if (DEBUG) frameT0 = performance.now();
  const dt = lastTs ? Math.min((ts - lastTs) / 16.667, 2.5) : 1;
  lastTs = ts;

  // Support spawnProb > 1 by spawning Math.floor(prob) times + fractional chance.
  // No cap gate here — spawnAt itself demotes a static drop to mist when full,
  // so the rain never stops.
  {
    const st = CFG.spawnProb * dt;
    const sn = Math.floor(st) + (Math.random() < (st % 1) ? 1 : 0);
    for (let i = 0; i < sn; i++) randomSpawn();
  }

  for (const d of droplets) d.update(dt);
  processMerges();

  // Cull dead. A dead drop's rivulet is orphaned AFTER the filter — orphan()
  // spawns the drain-bead into droplets, which must not happen mid-filter.
  const orphaned = [];
  droplets = droplets.filter(d => {
    if (d.dead && d.rivulet) orphaned.push(d.rivulet);
    return !d.dead;
  });
  for (const rv of orphaned) rv.orphan();

  // Rivulets: drain from the top, deposit beads, drop empties
  for (let i = rivulets.length - 1; i >= 0; i--) {
    if (rivulets[i].update(dt)) {
      rivulets[i] = rivulets[rivulets.length - 1];
      rivulets.pop();
    }
  }

  // ── Render ───────────────────────────────────────────────────────────────
  drawBg();
  ctx.drawImage(mistCvs, 0, 0);          // static mist: thousands of beads, one blit

  for (const s of streaks) { s.update(); s.draw(); }

  for (const rv of rivulets) rv.draw();

  // Short tails behind running drops (drawn before the drops themselves)
  for (const d of droplets)
    if (d.falling && d.vy > CFG.depositSpeedMin) drawTail(d);

  for (const d of droplets) if (!d.falling) d.draw();
  for (const d of droplets) if ( d.falling) d.draw();

  // Glass top-shine
  const shine = ctx.createLinearGradient(0, 0, 0, H * 0.07);
  shine.addColorStop(0, 'rgba(255,255,255,0.052)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine; ctx.fillRect(0, 0, W, H * 0.07);

  // Vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H * 0.28, W/2, H/2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.30)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (DEBUG) updateHud(dt);

  requestAnimationFrame(frame);
}

// ── Settings panel ────────────────────────────────────────────────────────────
const settingsBtn   = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
let settingsTimer   = null;

// Small build tag at the bottom of the settings panel (verify fresh load)
(() => {
  const v = document.createElement('div');
  v.textContent = 'build ' + BUILD;
  v.style.cssText = 'margin-top:12px;font-size:10px;opacity:0.45;text-align:center';
  settingsPanel.appendChild(v);
})();

function showSettingsBtn() {
  settingsBtn.classList.add('vis');
  clearTimeout(settingsTimer);
  if (!settingsPanel.classList.contains('vis')) {
    settingsTimer = setTimeout(() => settingsBtn.classList.remove('vis'), 2800);
  }
}

settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('vis');
  clearTimeout(settingsTimer);
  if (!settingsPanel.classList.contains('vis')) {
    settingsTimer = setTimeout(() => settingsBtn.classList.remove('vis'), 2000);
  }
});

// Close settings when tapping main canvas
canvas.addEventListener('touchstart', () => {
  if (settingsPanel.classList.contains('vis')) {
    settingsPanel.classList.remove('vis');
    settingsTimer = setTimeout(() => settingsBtn.classList.remove('vis'), 1500);
  }
}, { passive: true });

const spawnLabels = ['霧雨', '小雨', '中雨', '大雨', '豪雨'];
const spawnProbs  = [0.20, 0.45, 0.90, 1.8, 3.5]; // 0.90を中央(中雨)に

document.getElementById('minRSlider').addEventListener('input', e => {
  CFG.minR = parseFloat(e.target.value);
  document.getElementById('minRVal').textContent = CFG.minR.toFixed(1);
});
document.getElementById('maxRSlider').addEventListener('input', e => {
  CFG.maxR = parseFloat(e.target.value);
  document.getElementById('maxRVal').textContent = CFG.maxR.toFixed(1);
});
document.getElementById('spawnSlider').addEventListener('input', e => {
  const v = parseInt(e.target.value) - 1;
  CFG.spawnProb = spawnProbs[v];
  document.getElementById('spawnVal').textContent = spawnLabels[v];
});

// Debug-only: cycle test backgrounds (normal → stripes → checker → white)
if (DEBUG) {
  const row = document.createElement('div');
  row.className = 'srow';
  const b = document.createElement('button');
  b.textContent = '🧪 テスト背景';
  b.style.cssText =
    'width:100%;padding:7px 0;border-radius:8px;background:rgba(255,255,255,0.10);'
    + 'border:1px solid rgba(255,255,255,0.20);color:#ddeef8;'
    + 'font:13px system-ui,sans-serif;cursor:pointer';
  b.addEventListener('click', () => { testBgMode = (testBgMode + 1) % 4; applyTestBg(); });
  row.appendChild(b);
  settingsPanel.appendChild(row);
}

// ── Input ─────────────────────────────────────────────────────────────────────
function onPointer(e) {
  if (e.target !== canvas) return;
  e.preventDefault();
  showSettingsBtn();
  const pts  = e.changedTouches ?? [e];
  const rect = canvas.getBoundingClientRect();
  const scx  = W / rect.width, scy = H / rect.height;
  for (const p of pts) {
    const px = (p.clientX - rect.left) * scx;
    const py = (p.clientY - rect.top)  * scy;

    // Tap vibration: near-threshold drops nudge downward — and swallow any
    // mist beads they slide onto (they visibly land on them, so they merge)
    const vibrThresh = CFG.fallThresh * 0.72;
    for (const d of droplets) {
      if (d.falling || d.r < vibrThresh) continue;
      const ratio = (d.r - vibrThresh) / (CFG.fallThresh - vibrThresh + d.pinExtra);
      const oldY = d.y;
      d.y    += ratio * d.r * 0.50;
      d.bump  = Math.max(d.bump, 0.07 + ratio * 0.09);
      d.vibTimer = 8;
      const vol = takeMist(d.x, oldY, d.x, d.y, d.r * 0.9);
      if (vol > 0) d.r = Math.cbrt(d.r * d.r * d.r + vol);
      d.computeShape();
    }

    // Spawn drops at tap
    for (let i = 0; i < 4; i++)
      spawnAt(px + (Math.random() - 0.5) * 22, py + (Math.random() - 0.5) * 22);
  }
}
canvas.addEventListener('touchstart', onPointer, { passive: false });
canvas.addEventListener('mousedown',  onPointer);
document.addEventListener('mousedown', e => {
  if (e.target !== canvas) showSettingsBtn();
});

// ── Resize / Init ─────────────────────────────────────────────────────────────
function resizeCanvases() {
  // clientWidth/Height が UA の各種バー込みでも正確なビューポートサイズを返す
  W = canvas.width  = document.documentElement.clientWidth  || window.innerWidth;
  H = canvas.height = document.documentElement.clientHeight || window.innerHeight;
  mistCvs.width = W; mistCvs.height = H;   // resizing clears it…
  redrawMist();                             // …so repaint the recorded beads
}

function init() {
  resizeCanvases();
  updateBgCvs();
  streaks  = Array.from({ length: CFG.numStreaks }, () => new Streak(true));
  droplets = []; rivulets = [];
  for (let i = 0; i < 28; i++) randomSpawn();
}

window.addEventListener('resize', () => {
  resizeCanvases();
  if (DEBUG && testBgMode > 0) applyTestBg();
  else                         updateBgCvs();
  streaks = Array.from({ length: CFG.numStreaks }, () => new Streak(true));
});

init();
requestAnimationFrame(frame);
</script>
