<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a3540">
<title>Rain on Glass · 雨粒</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a2430}
#c{display:block;width:100%;height:100%;touch-action:none}
#fileBtn{
  position:fixed;bottom:16px;right:16px;
  width:42px;height:42px;border-radius:21px;
  background:rgba(0,0,0,0.35);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;color:#fff;
  -webkit-user-select:none;user-select:none;
}
#fileIn{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fileBtn" title="背景を変更">🖼</div>
<input id="fileIn" type="file" accept="image/*">
<script>
'use strict';

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

// ── Background ────────────────────────────────────────────────────────────────
let bgImg = null, bgCvs = null, bgCtx2 = null, bgReady = false;

function updateBgCvs() {
  if (!bgImg || !W) return;
  bgCvs = bgCvs || document.createElement('canvas');
  bgCtx2 = bgCtx2 || bgCvs.getContext('2d');
  bgCvs.width = W; bgCvs.height = H;
  const sc = Math.max(W / bgImg.naturalWidth, H / bgImg.naturalHeight);
  const bw = bgImg.naturalWidth * sc, bh = bgImg.naturalHeight * sc;
  try { bgCtx2.filter = 'blur(1px)'; } catch(e) {}
  bgCtx2.drawImage(bgImg, (W - bw) / 2, (H - bh) / 2, bw, bh);
  bgCtx2.filter = 'none';
  bgReady = true;
}

function loadImg(src) {
  const img = new Image();
  img.onload = () => { bgImg = img; updateBgCvs(); };
  img.src = src;
}

document.getElementById('fileBtn').addEventListener('click', () =>
  document.getElementById('fileIn').click());
document.getElementById('fileIn').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadImg(URL.createObjectURL(f));
});
canvas.addEventListener('dragover', e => e.preventDefault());
canvas.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f?.type.startsWith('image/')) loadImg(URL.createObjectURL(f));
});

// ── Config ────────────────────────────────────────────────────────────────────
const CFG = {
  spawnProb:    0.10,
  minR:         2.0,
  maxR:         8.0,
  fallThresh:   11,
  gravity:      0.18,
  maxSpeed:     12,
  maxDroplets:  600,
  numStreaks:   18,
  refrMag:      1.65,
  trailDecay:   0.007,
  beadThresh:   1.6,
  beadProb:     0.12,
  maxTrails:    20,
  gridCell:     32,
};

// ── Default background ────────────────────────────────────────────────────────
function drawDefaultBg() {
  const g = ctx.createLinearGradient(0, 0, W * 0.4, H);
  g.addColorStop(0,   '#bccbd4');
  g.addColorStop(0.45,'#cad8e2');
  g.addColorStop(1,   '#a8bfc9');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) {
    const yc = H * (0.1 + i * 0.18);
    const g2 = ctx.createLinearGradient(0, yc - 55, 0, yc + 55);
    g2.addColorStop(0,   'rgba(255,255,255,0)');
    g2.addColorStop(0.5, 'rgba(255,255,255,0.07)');
    g2.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = g2; ctx.fillRect(0, yc - 55, W, 110);
  }
}

function drawBg() {
  if (bgReady && bgCvs) ctx.drawImage(bgCvs, 0, 0);
  else drawDefaultBg();
}

// ── Rain streaks ──────────────────────────────────────────────────────────────
class Streak {
  constructor(init) { this.reset(init); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : -22;
    this.len = 8 + Math.random() * 16;
    this.spd = 7 + Math.random() * 8;
    this.a   = 0.05 + Math.random() * 0.10;
  }
  update() {
    this.x += this.spd * 0.10; this.y += this.spd;
    if (this.y > H + 25) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.len * 0.1, this.y + this.len);
    ctx.strokeStyle = bgReady
      ? `rgba(255,255,255,${this.a})`
      : `rgba(160,195,220,${this.a})`;
    ctx.lineWidth = 0.65; ctx.stroke();
  }
}
let streaks = [];

// ── Trail ─────────────────────────────────────────────────────────────────────
class Trail {
  constructor(pts) {
    this.segs = pts.map(p => ({ x: p.x, y: p.y, w: p.w }));
    this.dead = false;
  }
  update(dt) {
    const beads = [], alive = [];
    for (const s of this.segs) {
      s.w -= CFG.trailDecay * dt;
      if (s.w <= CFG.beadThresh) {
        if (Math.random() < CFG.beadProb)
          beads.push({ x: s.x + (Math.random() - 0.5) * 4, y: s.y,
                       r: 1.4 + Math.random() * 1.8 });
      } else { alive.push(s); }
    }
    this.segs = alive;
    this.dead = this.segs.length === 0;
    return beads;
  }
  draw() {
    if (this.segs.length < 2) return;
    for (let i = 0; i < this.segs.length - 1; i++) {
      const a = this.segs[i], b = this.segs[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy > 400) continue;
      const w      = (a.w + b.w) * 0.5;
      const wobble = 1 + 0.18 * Math.sin(a.y * 0.55);
      const alpha  = Math.min(0.52, (w - CFG.beadThresh) * 0.14);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = bgReady ? `rgba(220,235,248,${alpha})` : `rgba(175,205,225,${alpha})`;
      ctx.lineWidth = w * 2 * wobble;
      ctx.lineCap  = 'round'; ctx.stroke();
    }
  }
}

// ── Spatial grid – O(n) collision detection ───────────────────────────────────────────
class SpatialGrid {
  constructor() { this.cells = new Map(); }
  clear() { this.cells.clear(); }
  insert(d, i) {
    const k = `${Math.floor(d.x/CFG.gridCell)},${Math.floor(d.y/CFG.gridCell)}`;
    let c = this.cells.get(k); if (!c) { c = []; this.cells.set(k, c); }
    c.push(i);
  }
  neighbors(d) {
    const cx = Math.floor(d.x/CFG.gridCell), cy = Math.floor(d.y/CFG.gridCell);
    const out = [];
    for (let dx = -1; dx <= 1; dx++)
      for (let dy = -1; dy <= 1; dy++) {
        const c = this.cells.get(`${cx+dx},${cy+dy}`);
        if (c) for (const i of c) out.push(i);
      }
    return out;
  }
}
const grid = new SpatialGrid();

// ── Droplet ───────────────────────────────────────────────────────────────────
class Droplet {
  constructor(x, y, r) {
    this.x = x; this.y = y; this.r = r;
    this.vy = 0; this.vx = (Math.random() - 0.5) * 0.35;
    this.falling = false; this.dead = false; this.bump = 0;
    this.trailPts = [];
    this.lastTY   = y;
    this.phase    = Math.random() * Math.PI * 2;
    this.ttl = r < 5.0 ? 180 + Math.random() * 280 : Infinity;
  }

  get area() { return Math.PI * this.r * this.r; }

  overlaps(o) {
    const dx = this.x - o.x, dy = this.y - o.y;
    const rr = (this.r + o.r) * 0.94;
    return dx * dx + dy * dy < rr * rr;
  }

  absorb(o) {
    const v1 = this.r * this.r * this.r;
    const v2 = o.r   * o.r   * o.r;
    const vt = v1 + v2;
    if (!this.falling) {
      // r⁵ weighting: strongly biased toward the larger drop's position
      const w1 = v1 * this.r * this.r, w2 = v2 * o.r * o.r, wt = w1 + w2;
      this.x = (this.x * w1 + o.x * w2) / wt;
      this.y = (this.y * w1 + o.y * w2) / wt;
    }
    this.r    = Math.cbrt(vt);
    this.ttl  = Infinity;
    this.bump = 0.14;
    if (o.vy > this.vy) this.vy = o.vy * 0.5;
    o.dead = true;
  }

  update(dt) {
    if (this.ttl !== Infinity) {
      this.ttl -= dt;
      if (this.ttl <= 0) { this.dead = true; return; }
    }
    if (this.bump > 0) this.bump = Math.max(0, this.bump - 0.012 * dt);
    if (!this.falling && this.r >= CFG.fallThresh) {
      this.falling = true; this.vy = 0; this.lastTY = this.y;
    }
    if (this.falling) {
      // Larger drops have higher terminal velocity (Stokes-like: v_max ∝ r)
      const vMax = Math.min(CFG.maxSpeed, Math.max(0.4, this.r * 0.42 - 4.2));
      this.vy  = Math.min(this.vy + CFG.gravity * dt, vMax);
      this.y  += this.vy * dt;
      this.phase += 0.065 * dt;
      this.vx   += Math.sin(this.phase) * 0.11 * dt;
      this.x    += this.vx * dt;
      this.vx   *= Math.pow(0.955, dt);
      if (this.y - this.lastTY >= 3) {
        this.trailPts.push({ x: this.x, y: this.lastTY + 1.5, w: this.r * 0.36 });
        this.lastTY = this.y;
        if (this.trailPts.length > 220) this.trailPts.shift();
      }
      if (this.y - this.r > H) this.dead = true;
    }
  }

  _drawTrailLines(pts) {
    const n = pts.length;
    if (n < 2) return;
    for (let i = 0; i < n - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy > 400) continue;
      const w      = (a.w + b.w) * 0.5;
      const t      = i / n;
      const wobble = 1 + 0.16 * Math.sin(a.y * 0.52);
      const alpha  = Math.min(0.50, w * 0.14) * (0.25 + t * 0.75);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = bgReady ? `rgba(220,235,248,${alpha})` : `rgba(175,205,225,${alpha})`;
      ctx.lineWidth = w * 2 * wobble;
      ctx.lineCap  = 'round'; ctx.stroke();
    }
  }

  draw() {
    const r = this.r * (1 + Math.max(0, this.bump));
    const spd = this.falling ? Math.abs(this.vy) : 0;
    const sx  = this.falling ? 1 + Math.min(spd * 0.018, 0.32) : 1;
    const sy  = this.falling ? Math.max(0.68, 1 / (sx * 1.08))  : 1;
    const rx  = r * sx, ry = r * sy;

    if (this.falling && this.trailPts.length >= 2) this._drawTrailLines(this.trailPts);

    if (r < 3.5) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.fillStyle = bgReady ? 'rgba(210,228,242,0.50)' : 'rgba(190,215,230,0.50)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(30,55,80,0.32)';
      ctx.lineWidth = 0.5; ctx.stroke();
      return;
    }

    ctx.save();
    ctx.beginPath();
    if (this.falling) ctx.ellipse(this.x, this.y, rx, ry, 0, 0, Math.PI * 2);
    else              ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.clip();

    if (bgReady && bgCvs) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(-CFG.refrMag, -CFG.refrMag);
      ctx.translate(-this.x, -this.y);
      ctx.drawImage(bgCvs, 0, 0);
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(210,228,242,0.75)';
      ctx.fillRect(this.x - r, this.y - r, r * 2, r * 2);
    }

    const rMax = Math.max(rx, ry);
    const eg = ctx.createRadialGradient(this.x, this.y, rMax * 0.52, this.x, this.y, rMax);
    eg.addColorStop(0, 'rgba(0,0,0,0)');
    eg.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = eg;
    ctx.fillRect(this.x - rx, this.y - ry, rx * 2, ry * 2);

    const sp = ctx.createRadialGradient(
      this.x - rx * 0.30, this.y - ry * 0.36, 0,
      this.x - rx * 0.08, this.y - ry * 0.12, rMax * 0.60
    );
    sp.addColorStop(0,    'rgba(255,255,255,0.72)');
    sp.addColorStop(0.38, 'rgba(255,255,255,0.20)');
    sp.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.fillStyle = sp;
    ctx.fillRect(this.x - rx, this.y - ry, rx * 2, ry * 2);
    ctx.restore();

    ctx.beginPath();
    if (this.falling) ctx.ellipse(this.x, this.y, rx, ry, 0, 0, Math.PI * 2);
    else              ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,12,28,0.42)';
    ctx.lineWidth   = Math.max(0.7, r * 0.055);
    ctx.stroke();
  }
}

// ── Simulation ────────────────────────────────────────────────────────────────
let droplets = [], trails = [];

function spawnAt(x, y, r) {
  if (droplets.length >= CFG.maxDroplets) return;
  r = r ?? (CFG.minR + Math.random() * (CFG.maxR - CFG.minR));
  droplets.push(new Droplet(x, y, r));
}

function randomSpawn() {
  const cx = CFG.maxR + Math.random() * (W - CFG.maxR * 2);
  const cy = CFG.maxR + Math.random() * (H * 0.88 - CFG.maxR * 2);
  const n  = Math.random() < 0.5 ? 1 : Math.random() < 0.62 ? 2 : 3;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.random() * 8;
    spawnAt(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
  }
}

function processMerges() {
  grid.clear();
  for (let i = 0; i < droplets.length; i++)
    if (!droplets[i].dead) grid.insert(droplets[i], i);
  for (let i = 0; i < droplets.length; i++) {
    if (droplets[i].dead) continue;
    for (const j of grid.neighbors(droplets[i])) {
      if (j <= i || droplets[j].dead) continue;
      if (!droplets[i].overlaps(droplets[j])) continue;
      const fi = droplets[i].falling, fj = droplets[j].falling;
      if      ( fi && !fj)                      droplets[i].absorb(droplets[j]);
      else if (!fi &&  fj)                      droplets[j].absorb(droplets[i]);
      else if (droplets[i].r >= droplets[j].r)  droplets[i].absorb(droplets[j]);
      else                                       droplets[j].absorb(droplets[i]);
    }
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let lastTs = 0;

function frame(ts) {
  const dt = lastTs ? Math.min((ts - lastTs) / 16.667, 2.5) : 1;
  lastTs = ts;

  if (droplets.length < CFG.maxDroplets && Math.random() < CFG.spawnProb * dt)
    randomSpawn();

  for (const d of droplets) d.update(dt);
  processMerges();

  const alive = [];
  for (const d of droplets) {
    if (d.dead) {
      if (d.falling && d.trailPts.length >= 4 && trails.length < CFG.maxTrails)
        trails.push(new Trail(d.trailPts));
    } else { alive.push(d); }
  }
  droplets = alive;

  const aliveT = [];
  for (const t of trails) {
    const beads = t.update(dt);
    for (const b of beads) spawnAt(b.x, b.y, b.r);
    if (!t.dead) aliveT.push(t);
  }
  trails = aliveT;

  drawBg();
  for (const s of streaks) { s.update(); s.draw(); }
  for (const t of trails)   t.draw();
  for (const d of droplets) if (!d.falling) d.draw();
  for (const d of droplets) if ( d.falling) d.draw();

  const shine = ctx.createLinearGradient(0, 0, 0, H * 0.07);
  shine.addColorStop(0, 'rgba(255,255,255,0.055)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine; ctx.fillRect(0, 0, W, H * 0.07);

  const vg = ctx.createRadialGradient(W/2, H/2, H * 0.28, W/2, H/2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}

// ── Input ─────────────────────────────────────────────────────────────────────
function onPointer(e) {
  if (e.target !== canvas) return;
  e.preventDefault();
  const pts  = e.changedTouches ?? [e];
  const rect = canvas.getBoundingClientRect();
  const sx = W / rect.width, sy = H / rect.height;
  for (const p of pts) {
    const x = (p.clientX - rect.left) * sx;
    const y = (p.clientY - rect.top)  * sy;
    for (let i = 0; i < 5; i++)
      spawnAt(x + (Math.random() - 0.5) * 22, y + (Math.random() - 0.5) * 22);
  }
}
canvas.addEventListener('touchstart', onPointer, { passive: false });
canvas.addEventListener('mousedown',  onPointer);

// ── Resize / Init ─────────────────────────────────────────────────────────────
function init() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  updateBgCvs();
  streaks  = Array.from({ length: CFG.numStreaks }, () => new Streak(true));
  droplets = []; trails = [];
  for (let i = 0; i < 30; i++) randomSpawn();
}

window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  updateBgCvs();
  streaks = Array.from({ length: CFG.numStreaks }, () => new Streak(true));
});

init();
requestAnimationFrame(frame);
</script>
</body>
</html>
